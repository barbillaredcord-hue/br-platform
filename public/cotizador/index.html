<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ALUXOR Cotizaciones</title>
<style>
:root{--bg:#f4f1eb;--panel:#fff;--ink:#171717;--muted:#77736d;--line:#ddd7ce;--soft:#eee9e1;--dark:#161616;--ok:#325a45;--danger:#8b3d3d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f2efe9,#e9e4dc);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:18px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:74px;height:74px;object-fit:cover;border-radius:14px;background:#fff}.brand h1{margin:0;letter-spacing:.18em;font-size:22px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;letter-spacing:.12em}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}.tab.active,.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.ok{background:var(--ok);color:#fff;border-color:transparent}.btn.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 45px rgba(50,42,30,.08)}.card h2,.card h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}input,select,textarea{width:100%;border:1px solid var(--line);background:#fbfaf8;color:var(--ink);border-radius:9px;padding:10px 11px;outline:none}textarea{min-height:78px;resize:vertical}.items{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfaf8}.item-top{display:grid;grid-template-columns:2fr .7fr .8fr auto;gap:8px;align-items:end}.item-desc{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.45}.summary{display:grid;gap:10px}.sum-row{display:flex;justify-content:space-between;gap:16px;color:var(--muted)}.sum-row strong{color:var(--ink)}.sum-row.total{font-size:21px;border-top:1px solid var(--line);padding-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.catalog-list{display:grid;gap:10px}.catalog-row{display:grid;grid-template-columns:1fr 1.2fr .5fr .7fr auto;gap:8px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:12px}.small{font-size:12px;color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.quote-paper{background:#fff;color:#171717;border-radius:4px;padding:38px 42px;min-height:720px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.paper-head{display:flex;justify-content:space-between;gap:28px;align-items:flex-start;border-bottom:1px solid #bbb5ad;padding-bottom:20px}.paper-logo{width:130px;height:130px;object-fit:cover}.paper-brand-block{display:flex;gap:18px;align-items:center}.paper-title{font-size:13px;letter-spacing:.22em;color:#69645e;margin-top:8px}.paper-meta{text-align:right;font-size:12px;line-height:1.7}.paper-client{margin:24px 0;padding:14px 0;border-bottom:1px solid #e0ddd8;font-size:13px;line-height:1.7}.paper-table{width:100%;border-collapse:collapse;font-size:12px}.paper-table th{text-transform:uppercase;letter-spacing:.08em;font-size:10px;text-align:left;padding:10px 8px;border-bottom:1px solid #222}.paper-table td{padding:12px 8px;border-bottom:1px solid #e7e3dd;vertical-align:top}.paper-total{margin-left:auto;margin-top:22px;max-width:330px;font-size:13px}.paper-total div{display:flex;justify-content:space-between;padding:6px 0}.paper-total .grand{font-weight:800;font-size:19px;border-top:1px solid #222;margin-top:7px;padding-top:12px}.paper-notes{margin-top:34px;font-size:11px;color:#55504a;white-space:pre-wrap;line-height:1.6}.paper-footer{margin-top:40px;padding-top:14px;border-top:1px solid #ddd7cf;text-align:center;font-size:9px;letter-spacing:.18em;color:#77716a;text-transform:uppercase}.reader-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none}.reader-link:before{content:'▣'}@media(max-width:850px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item-top{grid-template-columns:1fr 1fr}.item-top .product-select{grid-column:1/-1}.catalog-row{grid-template-columns:1fr 1fr}.catalog-row .wide{grid-column:1/-1}.topbar{align-items:flex-start;flex-direction:column}.paper-head{flex-direction:column}.paper-meta{text-align:left}.quote-paper{padding:24px 18px}}@media print{body{background:#fff}.app>*:not(#previewSection){display:none!important}#previewSection{display:block!important;padding:0;margin:0}.quote-paper{border-radius:0;padding:0;min-height:auto;box-shadow:none}.app{max-width:none;padding:0}.card{border:0;box-shadow:none;padding:0;background:white}.actions{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><img src="/cotizador/aluxor-logo.svg" alt="ALUXOR"><div><h1>ALUXOR</h1><p>ALUMINUM & GLASS · COTIZACIONES</p></div></div>
    <div class="tabs"><button class="tab active" data-view="quote">Nueva cotización</button><button class="tab" data-view="catalog">Productos</button><a class="tab reader-link" href="/cotizador/lector.html">Leer imagen</a><button class="tab" data-view="preview">Vista PDF</button></div>
  </div>
  <section id="quoteView"><div class="grid"><div class="card"><h2>Nueva cotización</h2><div class="form-grid"><div class="field"><label>Folio</label><input id="folio"></div><div class="field"><label>Fecha</label><input id="date" type="date"></div><div class="field full"><label>Cliente</label><input id="client" placeholder="Nombre del cliente"></div><div class="field"><label>Teléfono</label><input id="phone" placeholder="81..."></div><div class="field"><label>Proyecto / obra</label><input id="project" placeholder="Casa, oficina, obra..."></div><div class="field full"><label>Dirección</label><input id="address" placeholder="Dirección del proyecto"></div></div><h3 style="margin-top:20px">Productos</h3><div id="items" class="items"></div><div class="actions"><button class="btn" id="addItem">+ Agregar producto</button></div></div><div class="card"><h2>Resultado</h2><div class="field"><label>IVA</label><select id="iva"><option value="0">Sin IVA</option><option value="0.16">16%</option></select></div><div class="field" style="margin-top:10px"><label>Anticipo %</label><input id="depositPct" type="number" min="0" max="100" value="50"></div><div class="summary" style="margin-top:18px"><div class="sum-row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div><div class="sum-row"><span>IVA</span><strong id="tax">$0.00</strong></div><div class="sum-row total"><span>Total</span><strong id="total">$0.00</strong></div><div class="sum-row"><span>Anticipo</span><strong id="deposit">$0.00</strong></div><div class="sum-row"><span>Saldo restante</span><strong id="balance">$0.00</strong></div></div><div class="field" style="margin-top:18px"><label>Notas / condiciones</label><textarea id="notes">Se requiere 50% de anticipo para iniciar y el 50% restante se cubre al instalar. Precios sujetos a verificación de medidas en obra. Vigencia de cotización: 15 días.</textarea></div><div class="actions"><button class="btn primary" id="previewBtn">Ver cotización ALUXOR</button><button class="btn ok" id="printBtn">Generar PDF / Imprimir</button><button class="btn" id="resetBtn">Nueva</button></div></div></div></section>
  <section id="catalogView" class="hidden"><div class="card"><h2>Catálogo de productos</h2><p class="small">Los precios que guardes aquí quedan disponibles para futuras cotizaciones en este dispositivo.</p><div class="form-grid"><div class="field"><label>Categoría</label><input id="newCategory" placeholder="CANCELES"></div><div class="field"><label>Producto</label><input id="newName" placeholder="Nombre"></div><div class="field"><label>Unidad</label><input id="newUnit" placeholder="m2 / ml / pza"></div><div class="field"><label>Precio unitario</label><input id="newPrice" type="number" min="0" step="0.01"></div><div class="field full"><label>Descripción</label><textarea id="newDescription"></textarea></div></div><div class="actions"><button class="btn primary" id="saveProduct">Agregar producto</button></div><div id="catalogList" class="catalog-list" style="margin-top:18px"></div></div></section>
  <section id="previewSection" class="hidden"><div class="card"><div id="paper" class="quote-paper"></div><div class="actions"><button class="btn" id="backBtn">Volver a editar</button><button class="btn ok" onclick="window.print()">Guardar / imprimir PDF</button></div></div></section>
</div>
<script>
const seed=[['CANCELES','CORREDIZO DE 6MM','Suministro e instalación de cancel corredizo modelo TRADICIONAL, fabricado en cristal templado de 6mm, con herrajes en acabado satin.','m2',0],['CANCELES','CORREDIZO DE 6MM EN ESCUADRA','Cancel corredizo modelo TRADICIONAL en escuadra, cristal templado de 6mm.','m2',0],['CANCELES','FIJO PUERTA DE 10MM','Cancel modelo FIJO-PUERTA en cristal templado de 10mm.','m2',0],['CANCELES','BACALAR DE 10MM','Cancel modelo BACALAR en cristal templado de 10mm.','m2',0],['BARANDAL','CACHETEADO','Barandal cacheteado en cristal claro templado de 10mm con herrajes en acero inoxidable.','m2',0],['BARANDAL','CLIPS','Barandal modelo clips en cristal claro templado de 10mm.','m2',0],['BARANDAL','POSTES','Barandal con postes de 2 pulgadas en acero inoxidable y cristal templado de 10mm.','m2',0],['BARANDAL','MINIPOSTES','Barandal modelo minipostes en cristal templado de 10mm.','m2',0],['ESPEJOS','ESPEJO PEGADO A MURO','Espejo natural en cristal de 6mm modelo pegado a muro.','m2',0],['ESPEJOS','ESPEJO FLOTADO','Espejo natural en cristal de 6mm modelo flotado con bastidor de aluminio.','m2',0],['ESPEJOS','LUZ LED','Espejo natural de 6mm con luz LED y bastidor de aluminio.','m2',0],['ESPEJOS','CENEFA ESMERILADA','Espejo natural de 6mm con cenefa esmerilada y luz LED.','m2',0],['PASAMANOS','PASAMANOS A MURO','Tubo pasamanos de 1.5 pulgadas a muro con herrajes en acero inoxidable.','ml',0],['PASAMANOS','PASAMANOS A VIDRIO','Tubo pasamanos de 1.5 pulgadas a vidrio con herrajes en acero inoxidable.','ml',0]].map((x,i)=>({id:'p'+i,category:x[0],name:x[1],description:x[2],unit:x[3],price:x[4]}));
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n||0));let catalog=JSON.parse(localStorage.getItem('br_quote_catalog')||'null')||seed;let items=[];const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function saveCatalog(){localStorage.setItem('br_quote_catalog',JSON.stringify(catalog))}function newFolio(){const d=new Date();return'ALX-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(Math.floor(Math.random()*900)+100)}function options(s=''){return'<option value="">Seleccionar producto...</option>'+catalog.map(p=>`<option value="${p.id}" ${s===p.id?'selected':''}>${esc(p.category)} · ${esc(p.name)}</option>`).join('')}function addItem(data={productId:'',qty:1,price:null}){items.push({...data,id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()))});renderItems();recalc()}function renderItems(){const r=$('#items');if(!items.length){r.innerHTML='<div class="empty">Agrega al menos un producto.</div>';return}r.innerHTML=items.map(it=>{const p=catalog.find(x=>x.id===it.productId),price=it.price??p?.price??0;return`<div class="item" data-id="${it.id}"><div class="item-top"><div class="field product-select"><label>Producto</label><select data-k="productId">${options(it.productId)}</select></div><div class="field"><label>Cantidad</label><input data-k="qty" type="number" min="0" step="0.01" value="${it.qty}"></div><div class="field"><label>Precio unit.</label><input data-k="price" type="number" min="0" step="0.01" value="${price}"></div><button class="btn danger" data-remove>×</button></div><div class="item-desc">${p?`${esc(p.description)}<br><b>${esc(p.unit)}</b> · Importe: ${money((it.qty||0)*(price||0))}`:'Selecciona un producto.'}</div></div>`}).join('');r.querySelectorAll('.item').forEach(el=>{const id=el.dataset.id;el.querySelectorAll('[data-k]').forEach(c=>c.addEventListener('input',e=>{const it=items.find(x=>x.id===id),k=e.target.dataset.k;if(k==='productId'){it.productId=e.target.value;it.price=catalog.find(x=>x.id===it.productId)?.price||0}else it[k]=Number(e.target.value||0);renderItems();recalc()}));el.querySelector('[data-remove]').onclick=()=>{items=items.filter(x=>x.id!==id);renderItems();recalc()}})}function totals(){const subtotal=items.reduce((s,it)=>{const p=catalog.find(x=>x.id===it.productId);return s+Number(it.qty||0)*Number(it.price??p?.price??0)},0),tax=subtotal*Number($('#iva').value||0),total=subtotal+tax,dep=total*(Number($('#depositPct').value||0)/100);return{subtotal,tax,total,dep,balance:total-dep}}function recalc(){const t=totals();$('#subtotal').textContent=money(t.subtotal);$('#tax').textContent=money(t.tax);$('#total').textContent=money(t.total);$('#deposit').textContent=money(t.dep);$('#balance').textContent=money(t.balance)}function renderCatalog(){const r=$('#catalogList');r.innerHTML=catalog.map(p=>`<div class="catalog-row" data-id="${p.id}"><input value="${esc(p.category)}" data-f="category"><input value="${esc(p.name)}" data-f="name"><input value="${esc(p.unit)}" data-f="unit"><input type="number" min="0" step="0.01" value="${p.price}" data-f="price"><button class="btn danger" data-del>Eliminar</button><textarea class="wide" data-f="description">${esc(p.description)}</textarea></div>`).join('');r.querySelectorAll('.catalog-row').forEach(row=>{const p=catalog.find(x=>x.id===row.dataset.id);row.querySelectorAll('[data-f]').forEach(x=>x.addEventListener('change',e=>{p[e.target.dataset.f]=e.target.dataset.f==='price'?Number(e.target.value||0):e.target.value;saveCatalog();renderItems()}));row.querySelector('[data-del]').onclick=()=>{catalog=catalog.filter(x=>x.id!==p.id);saveCatalog();renderCatalog();renderItems()}})}function show(v){$('#quoteView').classList.toggle('hidden',v!=='quote');$('#catalogView').classList.toggle('hidden',v!=='catalog');$('#previewSection').classList.toggle('hidden',v!=='preview');document.querySelectorAll('.tab[data-view]').forEach(t=>t.classList.toggle('active',t.dataset.view===v))}function preview(){const t=totals(),rows=items.map(it=>{const p=catalog.find(x=>x.id===it.productId);if(!p)return'';const price=Number(it.price??p.price??0);return`<tr><td><b>${esc(p.name)}</b><br><span style="color:#625d57">${esc(p.description)}</span></td><td>${esc(p.unit)}</td><td>${it.qty}</td><td>${money(price)}</td><td>${money(it.qty*price)}</td></tr>`}).join('');$('#paper').innerHTML=`<div class="paper-head"><div class="paper-brand-block"><img class="paper-logo" src="/cotizador/aluxor-logo.svg" alt="ALUXOR"><div><div style="font-size:26px;letter-spacing:.22em;font-weight:700">ALUXOR</div><div class="paper-title">ALUMINUM & GLASS</div></div></div><div class="paper-meta"><div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#777">Cotización</div><b>${esc($('#folio').value)}</b><br>${esc($('#date').value)}</div></div><div class="paper-client"><b>Cliente:</b> ${esc($('#client').value||'—')}<br><b>Proyecto:</b> ${esc($('#project').value||'—')}<br><b>Teléfono:</b> ${esc($('#phone').value||'—')}<br><b>Dirección:</b> ${esc($('#address').value||'—')}</div><table class="paper-table"><thead><tr><th>Concepto</th><th>Unidad</th><th>Cant.</th><th>P. unitario</th><th>Importe</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Sin productos</td></tr>'}</tbody></table><div class="paper-total"><div><span>Subtotal</span><b>${money(t.subtotal)}</b></div><div><span>IVA</span><b>${money(t.tax)}</b></div><div class="grand"><span>Total</span><span>${money(t.total)}</span></div><div><span>Anticipo</span><b>${money(t.dep)}</b></div><div><span>Saldo</span><b>${money(t.balance)}</b></div></div><div class="paper-notes"><b>Condiciones</b><br>${esc($('#notes').value)}</div><div class="paper-footer">ALUXOR · ALUMINUM & GLASS</div>`;show('preview')}
document.querySelector('.tabs').addEventListener('click',e=>{if(!e.target.dataset.view)return;e.target.dataset.view==='preview'?preview():show(e.target.dataset.view)});$('#addItem').onclick=()=>addItem();$('#iva').onchange=recalc;$('#depositPct').oninput=recalc;$('#previewBtn').onclick=preview;$('#printBtn').onclick=()=>{preview();setTimeout(()=>window.print(),50)};$('#backBtn').onclick=()=>show('quote');$('#resetBtn').onclick=()=>{items=[];['#client','#phone','#project','#address'].forEach(s=>$(s).value='');$('#folio').value=newFolio();$('#date').value=new Date().toISOString().slice(0,10);$('#depositPct').value=50;$('#iva').value=0;addItem();recalc()};$('#saveProduct').onclick=()=>{const name=$('#newName').value.trim();if(!name)return alert('Escribe el nombre del producto.');catalog.push({id:'p'+Date.now(),category:$('#newCategory').value.trim()||'OTROS',name,unit:$('#newUnit').value.trim()||'pza',price:Number($('#newPrice').value||0),description:$('#newDescription').value.trim()});saveCatalog();['#newCategory','#newName','#newUnit','#newPrice','#newDescription'].forEach(s=>$(s).value='');renderCatalog();renderItems()};$('#folio').value=newFolio();$('#date').value=new Date().toISOString().slice(0,10);addItem();renderCatalog();recalc();
</script>
</body>
</html>
