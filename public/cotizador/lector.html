<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ALUXOR · Lector de cotización</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f4f1eb;--card:#fff;--line:#ddd7ce;--text:#171717;--muted:#77736d;--accent:#161616;--ok:#325a45}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f2efe9,#e9e4dc);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:68px;object-fit:cover;border-radius:12px}.brand h1{font-size:21px;letter-spacing:.18em;margin:0}.brand .small{letter-spacing:.12em}.top a{color:#222;text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 45px rgba(50,42,30,.08)}.card h2{margin-top:0;font-size:18px}.drop{border:1px dashed #aaa39a;border-radius:16px;padding:18px;text-align:center;background:#fbfaf8}.drop input{width:100%}.preview{max-width:100%;max-height:360px;border-radius:12px;margin-top:12px}.btn{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:11px 14px;font-weight:600}.btn.primary{background:var(--accent);color:#fff;border-color:transparent}.btn.ok{background:var(--ok);color:#fff;border-color:transparent}.btn:disabled{opacity:.5}.status{font-size:13px;color:var(--muted);margin-top:10px}.bar{height:8px;background:#eee9e2;border-radius:99px;overflow:hidden;margin-top:8px}.bar>div{height:100%;width:0;background:#222}textarea,input{width:100%;background:#fbfaf8;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text)}textarea{min-height:150px}.result{display:grid;gap:10px}.opt{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfaf8}.row{display:grid;grid-template-columns:1fr .45fr .55fr;gap:8px}.small{color:var(--muted);font-size:12px}.quote{background:#fff;color:#171717;border-radius:4px;padding:38px 42px}.quote-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid #bbb5ad;padding-bottom:20px}.quote-brand{display:flex;gap:18px;align-items:center}.quote-brand img{width:126px;height:126px;object-fit:cover}.quote-name{font-size:26px;letter-spacing:.22em;font-weight:700}.quote-sub{font-size:10px;letter-spacing:.2em;color:#6f6962}.qrow{display:flex;justify-content:space-between;border-bottom:1px solid #e5e1db;padding:12px 0;gap:16px}.qmeta{font-size:12px;color:#4b4640;margin:22px 0 18px;line-height:1.6}.total{font-size:20px;font-weight:800;border-top:1px solid #222!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.badge{display:inline-block;background:#eee9e2;color:#4d4842;border-radius:999px;padding:5px 8px;font-size:11px;margin-right:6px}.warn{color:#8a5b13}.oktxt{color:#2f6f50}.footer{margin-top:36px;padding-top:14px;border-top:1px solid #ddd7cf;text-align:center;font-size:9px;letter-spacing:.18em;color:#77716a;text-transform:uppercase}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}.quote{padding:24px 18px}.quote-head{flex-direction:column}}@media print{body{background:white}.wrap>*:not(#quoteCard){display:none!important}#quoteCard{display:block!important;border:0;padding:0;background:white;box-shadow:none}.quote{padding:0}.actions{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><img src="/cotizador/aluxor-logo.svg" alt="ALUXOR"><div><h1>ALUXOR</h1><div class="small">ALUMINUM & GLASS · LECTOR DE COTIZACIÓN</div></div></div><a href="/cotizador/">← Cotizador</a></div>
  <div class="grid">
    <section class="card"><h2>1. Sube una captura</h2><div class="drop"><input id="file" type="file" accept="image/*"><img id="img" class="preview hidden" alt="Vista previa"></div><div class="actions"><button id="scan" class="btn primary" disabled>Analizar imagen</button></div><div id="status" class="status">Selecciona una imagen.</div><div class="bar"><div id="progress"></div></div><h2 style="margin-top:20px">Texto detectado</h2><textarea id="raw" placeholder="El texto extraído aparecerá aquí. También puedes pegar texto manualmente."></textarea><div class="actions"><button id="parse" class="btn">Interpretar texto</button></div></section>
    <section class="card"><h2>2. Datos detectados</h2><div class="row"><div class="wide"><div class="small">Cliente</div><input id="client" placeholder="Nombre del cliente"></div><div><div class="small">Anticipo %</div><input id="deposit" type="number" min="0" max="100" value="50"></div><div><div class="small">IVA %</div><input id="iva" type="number" min="0" value="0"></div></div><div id="flags" style="margin-top:12px"></div><h2 style="margin-top:18px">Opciones / conceptos</h2><div id="results" class="result"><div class="small">Todavía no hay conceptos detectados.</div></div><div class="actions"><button id="makeQuote" class="btn ok" disabled>Crear cotización ALUXOR</button></div></section>
  </div>
  <section id="quoteCard" class="card hidden" style="margin-top:14px"><div id="quote" class="quote"></div><div class="actions"><button class="btn" onclick="window.print()">Guardar / imprimir PDF</button></div></section>
</div>
<script>
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n||0));let parsed=[];const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('#file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;$('#img').src=URL.createObjectURL(f);$('#img').classList.remove('hidden');$('#scan').disabled=false;$('#status').textContent='Imagen lista para analizar.'});
$('#scan').onclick=async()=>{const f=$('#file').files?.[0];if(!f)return;$('#scan').disabled=true;$('#status').textContent='Leyendo texto en el dispositivo…';$('#progress').style.width='2%';try{const r=await Tesseract.recognize(f,'spa',{logger:m=>{if(m.status==='recognizing text'){const p=Math.round((m.progress||0)*100);$('#progress').style.width=p+'%';$('#status').textContent='Reconociendo texto… '+p+'%'}}});$('#raw').value=r.data.text||'';$('#progress').style.width='100%';$('#status').innerHTML='<span class="oktxt">Texto detectado. Interpretando…</span>';interpret()}catch(err){$('#status').innerHTML='<span class="warn">No se pudo leer la imagen. Puedes pegar el texto manualmente.</span>';console.error(err)}finally{$('#scan').disabled=false}};
$('#parse').onclick=interpret;
function clean(t){return t.replace(/\r/g,'').replace(/[|]/g,'I').replace(/\s+/g,' ').trim()}
function detectClient(t){const m=t.match(/(?:a\s+nombre\s+de|cliente\s*[:\-]?)[\s:]*([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,40})/i);return m?clean(m[1]).replace(/\b(la cotizaci[oó]n|cotizacion).*$/i,'').trim():''}
function detectDeposit(t){const m=t.match(/(\d{1,3})\s*%\s*(?:de\s*)?anticipo/i)||t.match(/anticipo[^\d]{0,20}(\d{1,3})\s*%/i);return m?Math.min(100,Number(m[1])):50}
function detectConcepts(t){const chunks=t.replace(/\n+/g,'\n').split(/(?=vidrios?\s+para|cristal|espejo|cancel|barandal|pasamanos)/i),out=[];for(const c0 of chunks){const c=clean(c0);if(!c)continue;for(const pm of c.matchAll(/\$\s*([\d.,]+)/g)){const price=Number(pm[1].replace(/,/g,''));if(!Number.isFinite(price))continue;const before=c.slice(0,pm.index).trim(),mm=before.match(/(templad[oa]\s+de\s+)?(\d+(?:\.\d+)?)\s*mm/i),thickness=mm?mm[2]+' mm':'',tempered=/templad[oa]/i.test(before);let name=before.replace(/^[\s:;,-]+/,'').replace(/\s+/g,' ');name=name.length>95?name.slice(-95):name;if(!name)name='Concepto detectado';out.push({name,price,qty:1,unit:'lote',thickness,tempered})}}return dedupe(out)}
function dedupe(arr){const seen=new Set();return arr.filter(x=>{const k=(x.name+'|'+x.price).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
function interpret(){const t=$('#raw').value||'';$('#client').value=detectClient(t)||$('#client').value;$('#deposit').value=detectDeposit(t);parsed=detectConcepts(t);renderParsed();const alternative=parsed.length>1&&/vidrios?\s+para\s+(?:las\s+)?ventanas/i.test(t);$('#flags').innerHTML=`<span class="badge">${parsed.length} concepto(s)</span>${alternative?'<span class="badge">Posibles alternativas</span>':''}<span class="badge">Procesado localmente</span>`;$('#makeQuote').disabled=!parsed.length}
function renderParsed(){const r=$('#results');if(!parsed.length){r.innerHTML='<div class="small">No se detectaron precios. Puedes editar el texto y volver a interpretar.</div>';return}r.innerHTML=parsed.map((x,i)=>`<div class="opt" data-i="${i}"><div class="small">Concepto ${i+1}</div><input data-f="name" value="${esc(x.name)}"><div class="row" style="margin-top:8px"><div><div class="small">Cantidad</div><input data-f="qty" type="number" min="0" step="0.01" value="${x.qty}"></div><div><div class="small">Unidad</div><input data-f="unit" value="${esc(x.unit)}"></div><div class="wide"><div class="small">Precio</div><input data-f="price" type="number" min="0" step="0.01" value="${x.price}"></div></div>${x.thickness||x.tempered?`<div class="small" style="margin-top:7px">${x.tempered?'Templado · ':''}${esc(x.thickness)}</div>`:''}</div>`).join('');r.querySelectorAll('.opt').forEach(el=>el.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=e=>{const x=parsed[Number(el.dataset.i)],f=e.target.dataset.f;x[f]=['qty','price'].includes(f)?Number(e.target.value||0):e.target.value}))}
$('#makeQuote').onclick=()=>{const subtotal=parsed.reduce((s,x)=>s+Number(x.qty||0)*Number(x.price||0),0),iva=subtotal*(Number($('#iva').value||0)/100),total=subtotal+iva,dep=total*(Number($('#deposit').value||0)/100),date=new Date().toLocaleDateString('es-MX');$('#quote').innerHTML=`<div class="quote-head"><div class="quote-brand"><img src="/cotizador/aluxor-logo.svg" alt="ALUXOR"><div><div class="quote-name">ALUXOR</div><div class="quote-sub">ALUMINUM & GLASS</div></div></div><div style="font-size:12px;text-align:right"><div style="text-transform:uppercase;letter-spacing:.16em;color:#777;font-size:9px">Cotización</div>${date}</div></div><div class="qmeta"><b>Cliente:</b> ${esc($('#client').value||'—')}</div>${parsed.map(x=>`<div class="qrow"><div><b>${esc(x.name)}</b><div style="font-size:11px;color:#6b665f">${x.qty} ${esc(x.unit)}${x.thickness?' · '+esc(x.thickness):''}</div></div><b>${money(x.qty*x.price)}</b></div>`).join('')}<div style="margin-top:18px;margin-left:auto;max-width:340px"><div class="qrow"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="qrow"><span>IVA</span><b>${money(iva)}</b></div><div class="qrow total"><span>Total</span><span>${money(total)}</span></div><div class="qrow"><span>Anticipo ${Number($('#deposit').value||0)}%</span><b>${money(dep)}</b></div><div class="qrow"><span>Saldo</span><b>${money(total-dep)}</b></div></div><div style="margin-top:28px;font-size:11px;color:#555;line-height:1.6"><b>Condiciones:</b><br>Se requiere ${Number($('#deposit').value||0)}% de anticipo para iniciar y el saldo restante se cubre al instalar. Precios sujetos a verificación de medidas.</div><div class="footer">ALUXOR · ALUMINUM & GLASS</div>`;$('#quoteCard').classList.remove('hidden');$('#quoteCard').scrollIntoView({behavior:'smooth'})};
</script>
</body>
</html>
