<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BR Cotizaciones · Lector de imagen</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0a1020;--card:#121a2d;--line:#28344f;--text:#eef4ff;--muted:#9aa9c4;--accent:#55aaff;--ok:#42d99a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08101c,#0e1628);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.top h1{font-size:23px;margin:0}.top a{color:#9dcbff;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.card h2{margin-top:0;font-size:18px}.drop{border:1px dashed #4a5d82;border-radius:16px;padding:18px;text-align:center}.drop input{width:100%}.preview{max-width:100%;max-height:360px;border-radius:12px;margin-top:12px}.btn{border:1px solid var(--line);border-radius:12px;background:#17233d;color:var(--text);padding:11px 14px;font-weight:600}.btn.primary{background:var(--accent);color:#06111f;border-color:transparent}.btn.ok{background:var(--ok);color:#06150e;border-color:transparent}.btn:disabled{opacity:.5}.status{font-size:13px;color:var(--muted);margin-top:10px}.bar{height:8px;background:#0b1323;border-radius:99px;overflow:hidden;margin-top:8px}.bar>div{height:100%;width:0;background:var(--accent)}textarea,input{width:100%;background:#0b1323;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}textarea{min-height:150px}.result{display:grid;gap:10px}.opt{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0d1628}.row{display:grid;grid-template-columns:1fr .45fr .55fr;gap:8px}.small{color:var(--muted);font-size:12px}.quote{background:#fff;color:#111827;border-radius:16px;padding:24px}.quote h2{margin:0}.qrow{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:10px 0;gap:16px}.qmeta{font-size:12px;color:#4b5563;margin:8px 0 18px}.total{font-size:20px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.badge{display:inline-block;background:#203052;color:#b9d9ff;border-radius:999px;padding:5px 8px;font-size:11px;margin-right:6px}.warn{color:#ffd18c}.oktxt{color:#8df2c4}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}@media print{body{background:white}.wrap>*:not(#quoteCard){display:none!important}#quoteCard{display:block!important;border:0;padding:0;background:white}.quote{padding:0}.actions{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>BR Lector de Cotización</h1><div class="small">OCR local + interpretación automática, sin OpenAI</div></div><a href="/cotizador/">← Cotizador</a></div>
  <div class="grid">
    <section class="card">
      <h2>1. Sube una captura</h2>
      <div class="drop"><input id="file" type="file" accept="image/*"><img id="img" class="preview hidden" alt="Vista previa"></div>
      <div class="actions"><button id="scan" class="btn primary" disabled>Analizar imagen</button></div>
      <div id="status" class="status">Selecciona una imagen.</div><div class="bar"><div id="progress"></div></div>
      <h2 style="margin-top:20px">Texto detectado</h2><textarea id="raw" placeholder="El texto extraído aparecerá aquí. También puedes pegar texto manualmente."></textarea>
      <div class="actions"><button id="parse" class="btn">Interpretar texto</button></div>
    </section>
    <section class="card">
      <h2>2. Datos detectados</h2>
      <div class="row"><div class="wide"><div class="small">Cliente</div><input id="client" placeholder="Nombre del cliente"></div><div><div class="small">Anticipo %</div><input id="deposit" type="number" min="0" max="100" value="50"></div><div><div class="small">IVA %</div><input id="iva" type="number" min="0" value="0"></div></div>
      <div id="flags" style="margin-top:12px"></div>
      <h2 style="margin-top:18px">Opciones / conceptos</h2><div id="results" class="result"><div class="small">Todavía no hay conceptos detectados.</div></div>
      <div class="actions"><button id="makeQuote" class="btn ok" disabled>Crear cotización</button></div>
    </section>
  </div>
  <section id="quoteCard" class="card hidden" style="margin-top:14px"><div id="quote" class="quote"></div><div class="actions"><button class="btn" onclick="window.print()">Guardar / imprimir PDF</button></div></section>
</div>
<script>
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n||0));let parsed=[];
$('#file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;$('#img').src=URL.createObjectURL(f);$('#img').classList.remove('hidden');$('#scan').disabled=false;$('#status').textContent='Imagen lista para analizar.'});
$('#scan').onclick=async()=>{const f=$('#file').files?.[0];if(!f)return;$('#scan').disabled=true;$('#status').textContent='Leyendo texto en el dispositivo…';$('#progress').style.width='2%';try{const r=await Tesseract.recognize(f,'spa',{logger:m=>{if(m.status==='recognizing text'){const p=Math.round((m.progress||0)*100);$('#progress').style.width=p+'%';$('#status').textContent='Reconociendo texto… '+p+'%'}}});$('#raw').value=r.data.text||'';$('#progress').style.width='100%';$('#status').innerHTML='<span class="oktxt">Texto detectado. Interpretando…</span>';interpret()}catch(err){$('#status').innerHTML='<span class="warn">No se pudo leer la imagen. Puedes pegar el texto manualmente.</span>';console.error(err)}finally{$('#scan').disabled=false}};
$('#parse').onclick=interpret;
function clean(t){return t.replace(/\r/g,'').replace(/[|]/g,'I').replace(/\s+/g,' ').trim()}
function detectClient(t){const m=t.match(/(?:a\s+nombre\s+de|cliente\s*[:\-]?)[\s:]*([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,40})/i);return m?clean(m[1]).replace(/\b(la cotizaci[oó]n|cotizacion).*$/i,'').trim():''}
function detectDeposit(t){const m=t.match(/(\d{1,3})\s*%\s*(?:de\s*)?anticipo/i)||t.match(/anticipo[^\d]{0,20}(\d{1,3})\s*%/i);return m?Math.min(100,Number(m[1])):50}
function detectConcepts(t){const normalized=t.replace(/\n+/g,'\n');const chunks=normalized.split(/(?=vidrios?\s+para|cristal|espejo|cancel|barandal|pasamanos)/i);const out=[];for(const c0 of chunks){const c=clean(c0);if(!c)continue;const priceMatches=[...c.matchAll(/\$\s*([\d.,]+)/g)];if(!priceMatches.length)continue;for(const pm of priceMatches){const price=Number(pm[1].replace(/,/g,''));if(!Number.isFinite(price))continue;const before=c.slice(0,pm.index).trim();const mm=(before.match(/(templad[oa]\s+de\s+)?(\d+(?:\.\d+)?)\s*mm/i));let thickness=mm?mm[2]+' mm':'';const tempered=/templad[oa]/i.test(before);let name=before.replace(/^[\s:;,-]+/,'').replace(/\s+/g,' ');name=name.length>95?name.slice(-95):name;if(!name)name='Concepto detectado';out.push({name,price,qty:1,unit:'lote',thickness,tempered});}}
return dedupe(out)}
function dedupe(arr){const seen=new Set();return arr.filter(x=>{const k=(x.name+'|'+x.price).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
function interpret(){const t=$('#raw').value||'';$('#client').value=detectClient(t)||$('#client').value;$('#deposit').value=detectDeposit(t);parsed=detectConcepts(t);renderParsed();const alternative=parsed.length>1&&/vidrios?\s+para\s+(?:las\s+)?ventanas/i.test(t);$('#flags').innerHTML=`<span class="badge">${parsed.length} concepto(s)</span>${alternative?'<span class="badge">Posibles alternativas</span>':''}<span class="badge">Procesado localmente</span>`;$('#makeQuote').disabled=!parsed.length}
function renderParsed(){const r=$('#results');if(!parsed.length){r.innerHTML='<div class="small">No se detectaron precios con formato $0.00. Puedes editar el texto y volver a interpretar.</div>';return}r.innerHTML=parsed.map((x,i)=>`<div class="opt" data-i="${i}"><div class="small">Concepto ${i+1}</div><input data-f="name" value="${esc(x.name)}"><div class="row" style="margin-top:8px"><div><div class="small">Cantidad</div><input data-f="qty" type="number" min="0" step="0.01" value="${x.qty}"></div><div><div class="small">Unidad</div><input data-f="unit" value="${esc(x.unit)}"></div><div class="wide"><div class="small">Precio total / unitario</div><input data-f="price" type="number" min="0" step="0.01" value="${x.price}"></div></div>${x.thickness||x.tempered?`<div class="small" style="margin-top:7px">${x.tempered?'Templado · ':''}${esc(x.thickness)}</div>`:''}</div>`).join('');r.querySelectorAll('.opt').forEach(el=>el.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=e=>{const x=parsed[Number(el.dataset.i)],f=e.target.dataset.f;x[f]=['qty','price'].includes(f)?Number(e.target.value||0):e.target.value}))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('#makeQuote').onclick=()=>{const subtotal=parsed.reduce((s,x)=>s+(Number(x.qty||0)*Number(x.price||0)),0),iva=subtotal*(Number($('#iva').value||0)/100),total=subtotal+iva,dep=total*(Number($('#deposit').value||0)/100);$('#quote').innerHTML=`<h2>COTIZACIÓN</h2><div class="qmeta">Cliente: <b>${esc($('#client').value||'—')}</b><br>Fecha: ${new Date().toLocaleDateString('es-MX')}</div>${parsed.map(x=>`<div class="qrow"><div><b>${esc(x.name)}</b><div style="font-size:12px;color:#6b7280">${x.qty} ${esc(x.unit)}</div></div><b>${money(x.qty*x.price)}</b></div>`).join('')}<div style="margin-top:16px;margin-left:auto;max-width:340px"><div class="qrow"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="qrow"><span>IVA</span><b>${money(iva)}</b></div><div class="qrow total"><span>Total</span><span>${money(total)}</span></div><div class="qrow"><span>Anticipo ${Number($('#deposit').value||0)}%</span><b>${money(dep)}</b></div><div class="qrow"><span>Saldo</span><b>${money(total-dep)}</b></div></div>`;$('#quoteCard').classList.remove('hidden');$('#quoteCard').scrollIntoView({behavior:'smooth'})};
</script>
</body>
</html>
